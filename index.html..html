<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Даша, я люблю тебя ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Marck Script, Great Vibes & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marck+Script&family=Montserrat:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #2d0b1e 0%, #12030d 100%);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-romantic {
            font-family: 'Marck Script', cursive;
        }

        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        /* Animated Pulsing Heart */
        .heart-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.75));
            transition: transform 0.3s ease;
        }

        .heart-container:hover {
            transform: scale(1.05);
        }

        .main-heart {
            width: 320px;
            height: 320px;
            fill: url(#heart-gradient);
            animation: pulse-beat 1.35s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes pulse-beat {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.6));
            }
            15% {
                transform: scale(1.12);
                filter: drop-shadow(0 0 35px rgba(244, 63, 94, 0.9));
            }
            28% {
                transform: scale(1.02);
                filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.7));
            }
            42% {
                transform: scale(1.18);
                filter: drop-shadow(0 0 45px rgba(244, 63, 94, 1));
            }
            70% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.6));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.6));
            }
        }

        /* Floating particles canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Dynamic Heart Burst on Click */
        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: floatUpAndFade 1.8s ease-out forwards;
        }

        @keyframes floatUpAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
            }
            50% {
                opacity: 0.8;
                transform: translate(-50%, -100px) scale(1.2) rotate(15deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -200px) scale(1.5) rotate(-15deg);
            }
        }

        /* Glassmorphism modal */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Soft Glow Text Effect */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                         0 0 20px rgba(244, 63, 94, 0.8),
                         0 0 30px rgba(236, 72, 153, 0.6);
        }

        @media (max-width: 640px) {
            .main-heart {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-between items-center relative overflow-hidden select-none">

    <canvas id="particleCanvas"></canvas>

    <header class="w-full p-4 flex justify-between items-center z-10 max-w-5xl mx-auto">
        <div class="flex items-center space-x-2 text-pink-300 font-romantic text-2xl tracking-wider">
            <i class="fa-solid font-romantic text-red-500"></i>
            <span>Для моей любимой Даши</span>
        </div>
        
        <!-- Interactive Controls -->
        <div class="flex items-center space-x-3">
            <button id="musicToggle" class="glass-card px-4 py-2 rounded-full text-sm text-pink-200 hover:text-white hover:bg-pink-900/40 transition duration-300 flex items-center space-x-2">
                <i id="musicIcon" class="fa-solid fa-music"></i>
                <span id="musicText">Музыка</span>
            </button>
        </div>
    </header>

    <main class="w-full flex-1 flex flex-col justify-center items-center px-4 z-10 my-6">
        
        <!-- Subtle Romantic Tagline -->
        <div class="mb-6 text-center animate-fade-in">
            <p class="font-romantic text-pink-200 text-2xl sm:text-3xl tracking-wide opacity-90">
                Ты — моё самое главное счастье
            </p>
        </div>

        <!-- Big Animated Heart with Text -->
        <div class="heart-container" id="heartButton" title="Нажми на сердце!">
            <svg class="main-heart" viewBox="0 0 24 24">
                <defs>
                    <linearGradient id="heart-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff1744" />
                        <stop offset="50%" stop-color="#e91e63" />
                        <stop offset="100%" stop-color="#9c27b0" />
                    </linearGradient>
                </defs>
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>

            <!-- Text layered on top of the heart -->
            <div class="absolute inset-0 flex flex-col justify-center items-center text-center p-6 pointer-events-none">
                <h1 class="font-romantic text-2xl sm:text-4xl md:text-5xl font-bold text-white leading-tight glow-text px-2">
                    Даша,<br>я люблю тебя
                </h1>
                <p class="text-xs sm:text-sm text-pink-100 font-light mt-2 opacity-90 drop-shadow">
                    (нажми меня)
                </p>
            </div>
        </div>

        <!-- Interactive Quote Card Trigger -->
        <div class="mt-8 flex flex-col items-center">
            <button id="reasonBtn" class="glass-card px-6 py-3 rounded-full text-pink-100 font-medium hover:bg-pink-500/20 hover:scale-105 transition-all duration-300 flex items-center space-x-2 border border-pink-400/30">
                <i class="fa-solid fa-envelope-open-heart text-pink-400"></i>
                <span>Почему я тебя люблю?</span>
            </button>
        </div>

    </main>

    <div id="noteModal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full border border-pink-500/30 text-center relative transform scale-90 transition-transform duration-300" id="modalCard">
            <button id="closeModal" class="absolute top-4 right-4 text-pink-300 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="text-pink-400 text-4xl mb-4">
                <i class="fa-solid fa-heart"></i>
            </div>
            <h3 class="font-romantic text-3xl text-pink-200 mb-4">Дорогая Даша</h3>
            <p id="reasonText" class="text-pink-100 text-lg leading-relaxed font-light mb-6">
                Каждый день рядом с тобой — это особенный подарок. Твоя улыбка освещает всё вокруг, а твои глаза дарят мне вдохновение и тепло.
            </p>
            <button id="nextReason" class="glass-card px-5 py-2.5 rounded-full text-sm text-pink-200 hover:bg-pink-600/40 transition">
                Ещё одно признание ✨
            </button>
        </div>
    </div>

    <footer class="w-full p-4 text-center text-xs text-pink-300/60 z-10">
        <p>Создано с бесконечной любовью для Даши ❤️</p>
    </footer>

    <script>
        // Particle Animation Engine
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Background floating heart class
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 20;
                this.size = Math.random() * 14 + 8;
                this.speedY = Math.random() * 1.2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.color = `hsla(${Math.random() * 40 + 330}, 100%, 70%, ${this.opacity})`;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 2;
            }

            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.01) * 0.8 + this.speedX;
                this.rotation += this.rotationSpeed;

                if (this.y < -30) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px FontAwesome`;
                ctx.fillText('\uf004', 0, 0); // Heart icon unicode
                ctx.restore();
            }
        }

        // Initialize background particles
        for (let i = 0; i < 45; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        const heartIcons = ['❤️', '💖', '💕', '💗', '✨', '🌸', '💘'];

        function createBurstHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'click-heart';
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            
            const randomIcon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            const randomSize = Math.floor(Math.random() * 20) + 24;
            
            heart.innerHTML = `<span style="font-size: ${randomSize}px;">${randomIcon}</span>`;
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1800);
        }

        window.addEventListener('click', (e) => {
            // Avoid creating hearts directly when clicking controls/buttons
            if (!e.target.closest('button')) {
                createBurstHeart(e.clientX, e.clientY);
            }
        });

        // Trigger additional heart burst when clicking the main heart
        const heartButton = document.getElementById('heartButton');
        heartButton.addEventListener('click', (e) => {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const offsetX = (Math.random() - 0.5) * 160;
                    const offsetY = (Math.random() - 0.5) * 160;
                    createBurstHeart(e.clientX + offsetX, e.clientY + offsetY);
                }, i * 80);
            }
        });

        let audioContext = null;
        let isPlaying = false;
        let melodyInterval = null;

        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');

        function playRomanticChords() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            const notes = [261.63, 329.63, 392.00, 493.88, 523.25]; // C4, E4, G4, B4, C5
            let noteIndex = 0;

            melodyInterval = setInterval(() => {
                if (!isPlaying) return;

                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIndex % notes.length], audioContext.currentTime);

                gain.gain.setValueAtTime(0.01, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, audioContext.currentTime + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 2.5);

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.start();
                osc.stop(audioContext.currentTime + 2.6);

                noteIndex = Math.floor(Math.random() * notes.length);
            }, 800);
        }

        musicToggle.addEventListener('click', () => {
            if (!isPlaying) {
                isPlaying = true;
                playRomanticChords();
                musicIcon.className = 'fa-solid fa-volume-high text-pink-400';
                musicText.innerText = 'Играет мелодия';
            } else {
                isPlaying = false;
                clearInterval(melodyInterval);
                musicIcon.className = 'fa-solid fa-music';
                musicText.innerText = 'Музыка';
            }
        });

        const reasons = [
            "Каждый день рядом с тобой — это особенный подарок. Твоя улыбка освещает всё вокруг!",
            "У тебя самые добрые глаза и самое прекрасное сердце на свете.",
            "Рядом с тобой я чувствую себя самым счастливым человеком.",
            "Твой смех — моя самая любимая мелодия во всей Вселенной.",
            "Ты вдохновляешь меня становиться лучше каждый день.",
            "Я люблю тебя просто за то, что ты есть — такая невероятная и родная!"
        ];

        let currentReasonIndex = 0;
        const noteModal = document.getElementById('noteModal');
        const modalCard = document.getElementById('modalCard');
        const reasonBtn = document.getElementById('reasonBtn');
        const closeModal = document.getElementById('closeModal');
        const nextReason = document.getElementById('nextReason');
        const reasonText = document.getElementById('reasonText');

        function openModal() {
            noteModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');
        }

        function hideModal() {
            noteModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
        }

        reasonBtn.addEventListener('click', openModal);
        closeModal.addEventListener('click', hideModal);

        noteModal.addEventListener('click', (e) => {
            if (e.target === noteModal) hideModal();
        });

        nextReason.addEventListener('click', () => {
            currentReasonIndex = (currentReasonIndex + 1) % reasons.length;
            reasonText.style.opacity = 0;
            setTimeout(() => {
                reasonText.innerText = reasons[currentReasonIndex];
                reasonText.style.opacity = 1;
            }, 200);
        });
    </script>
</body>
</html>
